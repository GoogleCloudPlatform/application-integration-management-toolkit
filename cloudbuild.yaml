# MOSS release pipeline for integrationcli (parent build):
#   0. remember previous PROD :latest digest
#   1. run child build (cloudbuild-build.yaml) -> Cloud Build attaches provenance/SBOM after it ends
#   2. wait for those attachments on DEV -> promote DEV->STAGING (INCLUDE) -> poll LRO
#   3. wait for AutoVM's NEW vuln attestation in STAGING -> promote STAGING->PROD
#      (PUBLIC_BCID_VSA_ONLY) -> poll LRO
#   4. tag PROD :<version>, :latest, :public-image-<version>   (unchanged)
#   5. deprecate the superseded PROD release                    (unchanged)
steps:

# 0. (unchanged) Record the digest currently behind PROD :latest.
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  id: capture_previous_prod
  entrypoint: 'bash'
  args:
    - -c
    - |
      PREV_DIGEST=$$(gcloud artifacts docker images describe ${_PROD_IMAGE}:latest \
        --format='value(image_summary.digest)' 2>/dev/null || true)
      echo "$${PREV_DIGEST}" > /workspace/prev_prod_digest.txt
      echo "Previous PROD :latest digest: $${PREV_DIGEST:-<none>}"

# 1. Run the child build and wait for it. The release tag is passed to the child as the
#    user substitution _TAG_NAME (with the commit as _COMMIT_SHA).
#    --async + polling avoids log-streaming problems with CLOUD_LOGGING_ONLY.
#    If the trigger runs as a custom service account, add
#    --service-account=projects/${PROJECT_ID}/serviceAccounts/<TRIGGER_SA_EMAIL>
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  id: run_child_build
  entrypoint: 'bash'
  args:
    - -c
    - |
      CHILD_ID=$$(gcloud builds submit . --config=cloudbuild-build.yaml \
        --region=us-west1 --project=${PROJECT_ID} --async --format='value(id)' \
        --substitutions=_DEV_IMAGE=${_DEV_IMAGE},_TAG_NAME=${TAG_NAME},_COMMIT_SHA=${COMMIT_SHA})
      if [ -z "$$CHILD_ID" ]; then echo "ERROR: could not start child build"; exit 1; fi
      echo "Child build: $$CHILD_ID"
      for i in $$(seq 1 90); do
        STATUS=$$(gcloud builds describe "$$CHILD_ID" --region=us-west1 --project=${PROJECT_ID} --format='value(status)')
        echo "Child build status: $$STATUS ($$i/90)"
        case "$$STATUS" in
          SUCCESS) exit 0 ;;
          FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED) echo "ERROR: child build $$STATUS"; exit 1 ;;
        esac
        sleep 20
      done
      echo "ERROR: child build did not finish in 30 minutes"; exit 1

# 2. Wait for Cloud Build attestations on DEV, then promote DEV -> STAGING and poll the LRO.
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  id: promote_to_staging
  entrypoint: 'bash'
  args:
    - -c
    - |
      DIGEST=$$(gcloud artifacts docker images describe ${_DEV_IMAGE}:${TAG_NAME} \
        --format='value(image_summary.digest)')
      DEV_TARGET="projects/${PROJECT_ID}/locations/us/repositories/${_DEV_REPO}/packages/integrationcli/versions/$$DIGEST"

      # 2a. Wait for Cloud Build's provenance + SBOM (namespace cloudbuild.googleapis.com).
      # TODO after first run (Step 5): check for the exact provenance + SBOM `type` values
      # instead of "at least 2" (Cloud Build may also attach a VSA in this namespace).
      OK=0
      for i in $$(seq 1 30); do
        GCB=$$(gcloud artifacts attachments list --repository=${_DEV_REPO} --location=us \
          --project=${PROJECT_ID} --target="$$DEV_TARGET" \
          --filter="attachmentNamespace=cloudbuild.googleapis.com" --format='value(type)')
        COUNT=$$(printf '%s\n' "$$GCB" | grep -c . || true)
        echo "DEV cloudbuild attachments ($$COUNT): $$(printf '%s' "$$GCB" | tr '\n' ' ')"
        if [ "$$COUNT" -ge 2 ]; then OK=1; break; fi
        sleep 20
      done
      if [ "$$OK" != "1" ]; then echo "ERROR: Cloud Build provenance/SBOM not attached to DEV in 10 min"; exit 1; fi

      # 2b. Wait until AutoVM has attached its DEV vulnerability attestation (so it doesn't
      # arrive mid-promotion and get mistaken for the fresh STAGING scan), then record DEV_AA.
      DEV_AA=0
      for i in $$(seq 1 30); do
        DEV_AA=$$(gcloud artifacts attachments list --repository=${_DEV_REPO} --location=us \
          --project=${PROJECT_ID} --target="$$DEV_TARGET" \
          --filter="attachmentNamespace=artifactanalysis.googleapis.com" --format='value(name)' | grep -c . || true)
        echo "DEV vuln attestations: $$DEV_AA ($$i/30)"
        if [ "$$DEV_AA" -ge 1 ]; then break; fi
        sleep 20
      done
      if [ "$$DEV_AA" -lt 1 ]; then echo "ERROR: AutoVM vuln attestation not attached to DEV in 10 min"; exit 1; fi
      echo "$$DEV_AA" > /workspace/dev_aa_count.txt

      # 2c. Promote DEV -> STAGING (destination repo in the URL).
      TOKEN=$$(gcloud auth print-access-token)
      HTTP=$$(curl -s -o /workspace/promote_stg.json -w "%{http_code}" \
        -H "Authorization: Bearer $$TOKEN" -H "Content-Type: application/json" -X POST \
        "https://artifactregistry.googleapis.com/v1/projects/${PROJECT_ID}/locations/us/repositories/${_STAG_REPO}:promoteArtifact" \
        -d "{
          \"source_repository\": \"projects/${PROJECT_ID}/locations/us/repositories/${_DEV_REPO}\",
          \"source_version\": \"$$DEV_TARGET\",
          \"attachment_behavior\": \"INCLUDE\"
        }")
      cat /workspace/promote_stg.json
      if [ "$$HTTP" != "200" ]; then echo "ERROR: promote dev->staging failed (HTTP $$HTTP)"; exit 1; fi

      # 2d. Poll the LRO. HTTP 200 only means "accepted"; exit-gate rejections show up here.
      OP_ID=$$(python3 -c "import json;print(json.load(open('/workspace/promote_stg.json')).get('name','').split('/')[-1])")
      if [ -z "$$OP_ID" ]; then echo "ERROR: no operation name in promote response"; exit 1; fi
      OP_OK=0
      for i in $$(seq 1 40); do
        OPJSON=$$(gcloud artifacts operations describe "$$OP_ID" --location=us --project=${PROJECT_ID} --format=json 2>/dev/null || true)
        DONE=$$(printf '%s' "$$OPJSON" | python3 -c "import json,sys;print('yes' if json.load(sys.stdin).get('done') else 'no')" 2>/dev/null || echo no)
        if [ "$$DONE" = "yes" ]; then
          ERR=$$(printf '%s' "$$OPJSON" | python3 -c "import json,sys;print((json.load(sys.stdin).get('error') or {}).get('message',''))" 2>/dev/null || echo "")
          if [ -n "$$ERR" ]; then echo "ERROR: dev->staging promotion rejected: $$ERR"; exit 1; fi
          OP_OK=1; echo "DEV->STAGING promotion done."; break
        fi
        sleep 15
      done
      if [ "$$OP_OK" != "1" ]; then echo "ERROR: dev->staging promotion did not finish in 10 min"; exit 1; fi

# 3. EXIT GATE: wait for AutoVM's NEW vuln attestation on the STAGING copy, then promote to PROD.
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  id: promote_to_prod
  entrypoint: 'bash'
  args:
    - -c
    - |
      DIGEST=$$(gcloud artifacts docker images describe ${_DEV_IMAGE}:${TAG_NAME} \
        --format='value(image_summary.digest)')
      STG_TARGET="projects/${PROJECT_ID}/locations/us/repositories/${_STAG_REPO}/packages/integrationcli/versions/$$DIGEST"
      DEV_AA=$$(cat /workspace/dev_aa_count.txt)

      # STAGING holds the copied DEV attestation(s) (DEV_AA of them) plus, once AutoVM has
      # scanned STAGING, one more. So wait until the count is greater than DEV_AA.
      OK=0
      for i in $$(seq 1 30); do
        STG_AA=$$(gcloud artifacts attachments list --repository=${_STAG_REPO} --location=us \
          --project=${PROJECT_ID} --target="$$STG_TARGET" \
          --filter="attachmentNamespace=artifactanalysis.googleapis.com" --format='value(name)' | grep -c . || true)
        echo "STAGING vuln attestations: $$STG_AA (DEV had $$DEV_AA) ($$i/30)"
        if [ "$$STG_AA" -gt "$$DEV_AA" ]; then OK=1; break; fi
        sleep 30
      done
      if [ "$$OK" != "1" ]; then echo "ERROR: no new AutoVM vuln attestation in STAGING after 15 min; not promoting"; exit 1; fi

      # Promote STAGING -> PROD. PUBLIC_BCID_VSA_ONLY keeps internal attestations out of
      # the public repo; BCID still evaluates them and logs the verdict the dashboard reads.
      TOKEN=$$(gcloud auth print-access-token)
      HTTP=$$(curl -s -o /workspace/promote_prod.json -w "%{http_code}" \
        -H "Authorization: Bearer $$TOKEN" -H "Content-Type: application/json" -X POST \
        "https://artifactregistry.googleapis.com/v1/projects/${PROJECT_ID}/locations/us/repositories/${_PROD_REPO}:promoteArtifact" \
        -d "{
          \"source_repository\": \"projects/${PROJECT_ID}/locations/us/repositories/${_STAG_REPO}\",
          \"source_version\": \"$$STG_TARGET\",
          \"attachment_behavior\": \"PUBLIC_BCID_VSA_ONLY\"
        }")
      cat /workspace/promote_prod.json
      if [ "$$HTTP" != "200" ]; then echo "ERROR: promote staging->prod failed (HTTP $$HTTP)"; exit 1; fi

      OP_ID=$$(python3 -c "import json;print(json.load(open('/workspace/promote_prod.json')).get('name','').split('/')[-1])")
      if [ -z "$$OP_ID" ]; then echo "ERROR: no operation name in promote response"; exit 1; fi
      OP_OK=0
      for i in $$(seq 1 40); do
        OPJSON=$$(gcloud artifacts operations describe "$$OP_ID" --location=us --project=${PROJECT_ID} --format=json 2>/dev/null || true)
        DONE=$$(printf '%s' "$$OPJSON" | python3 -c "import json,sys;print('yes' if json.load(sys.stdin).get('done') else 'no')" 2>/dev/null || echo no)
        if [ "$$DONE" = "yes" ]; then
          ERR=$$(printf '%s' "$$OPJSON" | python3 -c "import json,sys;print((json.load(sys.stdin).get('error') or {}).get('message',''))" 2>/dev/null || echo "")
          if [ -n "$$ERR" ]; then echo "ERROR: staging->prod promotion rejected: $$ERR"; exit 1; fi
          OP_OK=1; echo "STAGING->PROD promotion done."; break
        fi
        sleep 15
      done
      if [ "$$OP_OK" != "1" ]; then echo "ERROR: staging->prod promotion did not finish in 10 min"; exit 1; fi

# 4. (unchanged) Tag the promoted digest in PROD as :<version>, :latest, :public-image-<version>.
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  id: tag_prod
  entrypoint: 'bash'
  args:
    - -c
    - |
      DIGEST=$$(gcloud artifacts docker images describe ${_DEV_IMAGE}:${TAG_NAME} \
        --format='value(image_summary.digest)')
      gcloud artifacts docker tags add "${_PROD_IMAGE}@$$DIGEST" "${_PROD_IMAGE}:${TAG_NAME}" --quiet
      gcloud artifacts docker tags add "${_PROD_IMAGE}@$$DIGEST" "${_PROD_IMAGE}:latest" --quiet
      # MOSS Cap-2 (activate public image scanning, go/autovm-scanner-activation#public):
      # mark the new ACTIVE release with a public-image-<version> lifecycle tag so
      # the scanner enrolls it as an active public image.
      gcloud artifacts docker tags add "${_PROD_IMAGE}@$$DIGEST" "${_PROD_IMAGE}:public-image-${TAG_NAME}" --quiet
      echo "Tagged PROD $$DIGEST as ${TAG_NAME}, latest, and public-image-${TAG_NAME}."

# 5. (unchanged) Retire the PREVIOUS PROD release.
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  id: deprecate_previous_prod
  entrypoint: 'bash'
  args:
    - -c
    - |
      PREV_DIGEST=$$(cat /workspace/prev_prod_digest.txt 2>/dev/null || true)
      NEW_DIGEST=$$(gcloud artifacts docker images describe ${_PROD_IMAGE}:${TAG_NAME} \
        --format='value(image_summary.digest)' 2>/dev/null || true)
      if [ -z "$$PREV_DIGEST" ]; then
        echo "No previous PROD release found; nothing to deprecate (first release?)."
        exit 0
      fi
      if [ "$$PREV_DIGEST" = "$$NEW_DIGEST" ]; then
        echo "Previous PROD release already points at this build ($$NEW_DIGEST); skipping."
        exit 0
      fi
      SHA="$${PREV_DIGEST#sha256:}"
      echo "Deprecating previous PROD release $$PREV_DIGEST as ${_LIFECYCLE_TAG_PREFIX}$$SHA"
      gcloud artifacts docker tags add \
        "${_PROD_IMAGE}@$$PREV_DIGEST" \
        "${_PROD_IMAGE}:${_LIFECYCLE_TAG_PREFIX}$$SHA" --quiet
      PREV_TAGS=$$(gcloud artifacts docker images list "${_PROD_IMAGE}" --include-tags \
        --filter="version:$$PREV_DIGEST" --format='value(tags)' 2>/dev/null | tr ',' '\n')
      for t in $$PREV_TAGS; do
        case "$$t" in
          public-image-*)
            T_DIGEST=$$(gcloud artifacts docker images describe "${_PROD_IMAGE}:$$t" \
              --format='value(image_summary.digest)' 2>/dev/null || true)
            if [ "$$T_DIGEST" = "$$PREV_DIGEST" ]; then
              echo "Removing active marker $$t from superseded release"
              gcloud artifacts docker tags delete "${_PROD_IMAGE}:$$t" --quiet || true
            else
              echo "Skipping $$t (resolves to $$T_DIGEST, not the superseded digest)"
            fi
            ;;
        esac
      done

substitutions:
  _DEV_REPO: "integrationcli-dev"
  _STAG_REPO: "integrationcli-staging"
  _PROD_REPO: "images"
  _DEV_IMAGE: "us-docker.pkg.dev/${PROJECT_ID}/${_DEV_REPO}/integrationcli"
  _PROD_IMAGE: "us-docker.pkg.dev/${PROJECT_ID}/${_PROD_REPO}/integrationcli"
  # Lifecycle-tag prefix applied to the superseded PROD release on each new release.
  # Switch to "no-new-use-public-image-" if older releases stay supported.
  _LIFECYCLE_TAG_PREFIX: "deprecated-public-image-"

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
  substitution_option: ALLOW_LOOSE
  dynamic_substitutions: true

# Raised from 3600s: the parent now waits for the child build (<=30m), the attestations
# (<=10m), two promotions (<=10m each) and the AutoVM scan (<=15m).
timeout: 5400s
