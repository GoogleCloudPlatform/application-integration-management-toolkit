#
# Dependency updates. Patch and minor updates arrive as one grouped PR per
# ecosystem; security updates arrive as soon as an advisory is published.
# .github/workflows/dependency-release.yml merges them once CI passes and
# releases the next patch version, so a dependency CVE is fixed and published
# without a human step. Major updates are not grouped and are left for a human.
# The cooldown waits a few days after a version is published before adopting
# it, so a compromised or quickly-yanked release is not picked up blindly.
version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      go-deps:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      go-security:
        applies-to: security-updates
        patterns: ["*"]

  # The runtime base image is pinned by digest in the Dockerfile; this keeps
  # the digest current so base-image CVE fixes ship too. The internal jq helper
  # image lives in a private registry Dependabot cannot read.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "us-docker.pkg.dev/appintegration-toolkit/internal/jq"
    groups:
      docker:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
