name: integrationcli Binary Release

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    # Publish semver tags as releases.
    tags:
      - v[0-9]+.[0-9]+.[0-9]+
      - v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+
  workflow_dispatch:

jobs:

  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for Workload Identity Federation with OSS Exit Gate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@0c52d547c9bc32b1aa3301fd7a9cb496313a4491 #v5.0.0
        with:
          go-version-file: './go.mod'
          check-latest: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a #v9.3.0
        with:
          version: v2.10.1 #latest
          args: --timeout=4m

      - name: Write private key to disk
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "${COSIGN_PRIVATE_KEY}" > /tmp/cosign.key
          chmod 600 /tmp/cosign.key

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 #v4.1.3

      - name: Run GoReleaser (build and sign only)
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de #v7.3.0
        with:
          distribution: goreleaser
          version: latest
          args: release --clean --skip=publish
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          # Read-only built-in token (contents: read) for GoReleaser git/changelog lookups;
          # replaces the privileged secrets.TOKEN PAT since publishing moves to OSS Exit Gate.
          GITHUB_TOKEN: ${{ github.token }}

      - name: Remove private key from disk
        if: always()
        run: rm -f /tmp/cosign.key

      - name: Upload workflow build artifacts
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: integrationcli
          path: dist/*

      - name: Stage release assets (.zip, checksums, .sig)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          stage_dir="${RUNNER_TEMP}/integrationcli-assets"
          rm -rf "${stage_dir}"
          mkdir -p "${stage_dir}"
          shopt -s nullglob
          assets=(dist/*.zip dist/*.zip.sig dist/checksums.txt dist/checksums.txt.sig)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "ERROR: no release archives/signatures found under dist/" >&2
            exit 1
          fi
          cp -p "${assets[@]}" "${stage_dir}/"
          ls -la "${stage_dir}"

      - name: Authenticate to OSS Exit Gate via WIF
        if: startsWith(github.ref, 'refs/tags/v')
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: "projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github"

      - name: Set up gcloud CLI
        if: startsWith(github.ref, 'refs/tags/v')
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Upload assets to Artifact Registry and trigger release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG_NAME: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          AR_PROJECT: oss-exit-gate-prod
          AR_LOCATION: us
          AR_REPO: gcp-app-integration-tk--githubreleases
          PACKAGE_NAME: gcp-app-integration-tk
          MANIFEST_BUCKET: gs://oss-exit-gate-prod-projects-bucket/gcp-app-integration-tk/githubreleases/manifests
        run: |
          set -euo pipefail
          umask 077
          stage_dir="${RUNNER_TEMP}/integrationcli-assets"
          manifest_path="${RUNNER_TEMP}/manifest-${RUN_ID}-${RUN_ATTEMPT}.json"
          trap 'rm -f "${manifest_path}"' EXIT

          release_version="${TAG_NAME#v}"
          if [ -z "${release_version}" ]; then
            echo "ERROR: empty release version derived from tag '${TAG_NAME}'" >&2
            exit 1
          fi

          if [[ "${TAG_NAME}" == *-beta.* ]]; then
            is_prerelease=true
            is_latest=false
          else
            is_prerelease=false
            is_latest=true
          fi

          # Remove only the colliding version (if a prior run failed/retried).
          gcloud artifacts versions delete "${release_version}" \
            --project="${AR_PROJECT}" \
            --location="${AR_LOCATION}" \
            --repository="${AR_REPO}" \
            --package="${PACKAGE_NAME}" \
            --quiet || true

          gcloud artifacts generic upload \
            --project="${AR_PROJECT}" \
            --location="${AR_LOCATION}" \
            --repository="${AR_REPO}" \
            --package="${PACKAGE_NAME}" \
            --version="${release_version}" \
            --source-directory="${stage_dir}"

          jq -n \
            --arg pkg "${PACKAGE_NAME}" \
            --arg ver "${release_version}" \
            --arg tag "${TAG_NAME}" \
            --argjson pre "${is_prerelease}" \
            --argjson latest "${is_latest}" \
            '{
              publish_all: false,
              publishing_groups: [
                {
                  packages: [
                    { name: $pkg, version: $ver }
                  ]
                }
              ],
              registry_config: {
                github_releases: {
                  name: $tag,
                  tag: $tag,
                  is_draft: false,
                  is_prerelease: $pre,
                  is_latest: $latest
                }
              }
            }' > "${manifest_path}"

          gcloud storage cp --if-generation-match=0 \
            "${manifest_path}" \
            "${MANIFEST_BUCKET}/manifest-${RUN_ID}-${RUN_ATTEMPT}.json"
